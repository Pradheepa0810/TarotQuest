<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 128"
     fill="none" stroke="#dcb977" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-labelledby="title desc">
  <title id="title">TarotQuest</title>
  <desc id="desc">A pentacle — a five-pointed star inscribed in a circle — with a small sword hilt and budding wand mark on two of its points, and a cup resting at its base.</desc>

  <circle cx="64" cy="64" r="54"/>

  <!-- One continuous pentagram, using the supplied vertices. -->
  <path d="M64,10 L95.75,107.69 L12.65,47.31 L115.35,47.31 L32.25,107.69 Z"/>

  <!-- Secondary sword crossguard and budding wand mark. -->
  <g stroke-width="3.5">
    <line x1="34.5" y1="81.4" x2="45.9" y2="85.1"/>
    <line x1="75.1" y1="44.2" x2="81.8" y2="46.4"/>
  </g>

  <!-- Shallow cup; uniform gold, without a center accent. -->
  <path d="M40,107 Q64,122 88,107"/>
</svg>